<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vida+ Recife</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      background-color: #E2F0EF;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #root {
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #E2F0EF;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .content-area {
      flex: 1;
      padding: 16px;
      padding-bottom: 90px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ÍCONES ---
    const IconGlicemia = () => <span className="text-2xl">🩸</span>;
    const IconPressao = () => <span className="text-2xl">❤️</span>;
    const IconMedicamentos = () => <span className="text-2xl">💊</span>;
    const IconConsultas = () => <span className="text-2xl">📅</span>;
    const IconAlimentacao = () => <span className="text-2xl">🥗</span>;
    const IconHistorico = () => <span className="text-2xl">📊</span>;
    const IconHome = () => <span className="text-xl">🏠</span>;
    const IconDados = () => <span className="text-xl">📈</span>;
    const IconPerfil = () => <span className="text-xl">👤</span>;

    // --- TELAS ---

    // 1. HOME
    function HomeScreen({ setScreen, historico, usuario }) {
      const ultimaGlicemia = historico.find(h => h.glicemia)?.glicemia || '118';
      const ultimaPressao = historico.find(h => h.sistolica)?.sistolica ? 
        `${historico.find(h => h.sistolica).sistolica}/${historico.find(h => h.sistolica).diastolica}` : '130/85';

      return (
        <div>
          <div className="flex justify-between items-center mb-4">
            <div>
              <h1 className="text-3xl font-bold text-[#147E74]">Vida+ Recife</h1>
              <p className="text-xs text-[#5C8C88]">Cuidar hoje para viver melhor amanhã.</p>
            </div>
            <button onClick={() => setScreen('perfil')} className="w-10 h-10 rounded-full bg-[#147E74] flex items-center justify-center text-white font-bold text-sm shadow">
              {usuario.iniciais || 'VR'}
            </button>
          </div>

          <div className="bg-[#147E74] text-white p-5 rounded-2xl mb-5 shadow-sm">
            <h2 className="text-2xl font-semibold flex items-center gap-2">
              Olá, {usuario.nome.split(' ')[0]} <span className="text-2xl">👋</span>
            </h2>
            <p className="text-xs mt-1 text-emerald-100">Registre seus dados de saúde hoje.</p>
            <button onClick={() => setScreen('registrar')} className="bg-white text-[#147E74] font-bold text-xs px-4 py-2 rounded-lg mt-4 shadow hover:bg-emerald-50 active:scale-95 transition">
              Registrar agora
            </button>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-6">
            <div className="bg-white p-4 rounded-xl shadow-sm border border-emerald-50">
              <p className="text-xs text-[#5C8C88] font-medium">Glicemia</p>
              <p className="text-xl font-bold text-[#147E74] mt-1">{ultimaGlicemia} <span className="text-xs font-normal">mg/dL</span></p>
              <p className="text-[10px] text-[#5C8C88] mt-1">Último registro</p>
            </div>
            <div className="bg-white p-4 rounded-xl shadow-sm border border-emerald-50">
              <p className="text-xs text-[#5C8C88] font-medium">Pressão</p>
              <p className="text-xl font-bold text-[#147E74] mt-1">{ultimaPressao} <span className="text-xs font-normal">mmHg</span></p>
              <p className="text-[10px] text-[#5C8C88] mt-1">Última medição</p>
            </div>
          </div>

          <h3 className="text-base font-bold text-[#147E74] mb-3">Acesso rápido</h3>
          
          <div className="grid grid-cols-2 gap-3 mb-6">
            <button onClick={() => setScreen('registrar')} className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center gap-1.5 text-center h-24 hover:bg-emerald-50 active:scale-95 transition">
              <IconGlicemia />
              <span className="text-xs font-semibold text-[#147E74]">Registrar glicemia</span>
            </button>
            <button onClick={() => setScreen('registrar')} className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center gap-1.5 text-center h-24 hover:bg-emerald-50 active:scale-95 transition">
              <IconPressao />
              <span className="text-xs font-semibold text-[#147E74]">Registrar pressão</span>
            </button>
            <button onClick={() => setScreen('remedios')} className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center gap-1.5 text-center h-24 hover:bg-emerald-50 active:scale-95 transition">
              <IconMedicamentos />
              <span className="text-xs font-semibold text-[#147E74]">Medicamentos</span>
            </button>
            <button onClick={() => setScreen('consultas')} className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center gap-1.5 text-center h-24 hover:bg-emerald-50 active:scale-95 transition">
              <IconConsultas />
              <span className="text-xs font-semibold text-[#147E74]">Consultas</span>
            </button>
            <button onClick={() => setScreen('alimentacao')} className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center gap-1.5 text-center h-24 hover:bg-emerald-50 active:scale-95 transition">
              <IconAlimentacao />
              <span className="text-xs font-semibold text-[#147E74]">Alimentação</span>
            </button>
            <button onClick={() => setScreen('historico')} className="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center gap-1.5 text-center h-24 hover:bg-emerald-50 active:scale-95 transition">
              <IconHistorico />
              <span className="text-xs font-semibold text-[#147E74]">Histórico</span>
            </button>
          </div>

          <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-50">
            <h4 className="text-sm font-bold text-[#147E74] mb-1">Dica de hoje</h4>
            <p className="text-xs text-[#5C8C88] leading-relaxed">Evite excesso de sódio e açúcar. Pequenas mudanças ajudam no controle da hipertensão e diabetes.</p>
          </div>
        </div>
      );
    }

    // 2. REGISTRAR MEDIÇÃO
    function RegistrarScreen({ setScreen, addMedicao }) {
      const [glicemia, setGlicemia] = useState('');
      const [sistolica, setSistolica] = useState('');
      const [diastolica, setDiastolica] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!glicemia && (!sistolica || !diastolica)) {
          alert('Preencha a glicemia ou os valores da pressão.');
          return;
        }

        addMedicao({
          glicemia: glicemia ? Number(glicemia) : null,
          sistolica: sistolica ? Number(sistolica) : null,
          diastolica: diastolica ? Number(diastolica) : null,
        });

        alert('Registro salvo com sucesso!');
        setScreen('historico');
      };

      return (
        <div>
          <button onClick={() => setScreen('home')} className="text-xs font-medium text-[#147E74] flex items-center gap-1 mb-4">
            ← Voltar
          </button>
          <h1 className="text-2xl font-bold text-[#147E74] mb-4">Novo Registro</h1>

          <form onSubmit={handleSubmit} className="bg-white p-5 rounded-2xl shadow-sm space-y-4">
            <div>
              <label className="block text-xs font-bold text-[#147E74] mb-1">Glicemia (mg/dL)</label>
              <input 
                type="number" 
                placeholder="Ex: 110" 
                value={glicemia} 
                onChange={(e) => setGlicemia(e.target.value)}
                className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-[#147E74]"
              />
            </div>

            <div>
              <label className="block text-xs font-bold text-[#147E74] mb-1">Pressão Arterial (mmHg)</label>
              <div className="flex gap-2">
                <input 
                  type="number" 
                  placeholder="Sistólica (120)" 
                  value={sistolica} 
                  onChange={(e) => setSistolica(e.target.value)}
                  className="w-1/2 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-[#147E74]"
                />
                <input 
                  type="number" 
                  placeholder="Diastólica (80)" 
                  value={diastolica} 
                  onChange={(e) => setDiastolica(e.target.value)}
                  className="w-1/2 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-[#147E74]"
                />
              </div>
            </div>

            <button type="submit" className="w-full bg-[#147E74] text-white font-bold text-sm py-3 rounded-xl shadow hover:bg-[#0E6058] transition mt-2">
              Salvar Medição
            </button>
          </form>
        </div>
      );
    }

    // 3. TELA HISTÓRICO
    function HistoricoScreen({ setScreen, historico }) {
      return (
        <div>
          <button onClick={() => setScreen('home')} className="text-xs font-medium text-[#147E74] flex items-center gap-1 mb-4">
            ← Voltar
          </button>
          <h1 className="text-2xl font-bold text-[#147E74] mb-4">Histórico de Medições</h1>

          {historico.length === 0 ? (
            <div className="bg-white p-6 rounded-2xl text-center text-xs text-[#5C8C88]">
              Nenhum registro cadastrado até o momento.
            </div>
          ) : (
            <div className="space-y-3">
              {historico.map((item) => (
                <div key={item.id} className={`bg-white p-4 rounded-xl shadow-sm border-l-4 ${item.alerta ? 'border-red-500 bg-red-50/30' : 'border-[#147E74]'}`}>
                  <div className="flex justify-between items-center text-[10px] text-[#5C8C88] mb-2">
                    <span>{item.data} às {item.hora}</span>
                    {item.alerta && <span className="bg-red-500 text-white font-bold px-2 py-0.5 rounded-full">Atenção</span>}
                  </div>
                  <div className="flex gap-4 text-sm">
                    {item.glicemia && (
                      <p><span className="text-xs text-[#5C8C88]">Glicemia:</span> <strong className="text-[#147E74]">{item.glicemia} mg/dL</strong></p>
                    )}
                    {item.sistolica && (
                      <p><span className="text-xs text-[#5C8C88]">Pressão:</span> <strong className="text-[#147E74]">{item.sistolica}/{item.diastolica} mmHg</strong></p>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // 4. TELA MEDICAMENTOS
    function RemediosScreen({ setScreen }) {
      const [lembreteAtivo, setLembreteAtivo] = useState(false);

      return (
        <div>
          <button onClick={() => setScreen('home')} className="text-xs font-medium text-[#147E74] flex items-center gap-1 mb-4">
            ← Voltar
          </button>
          
          <h1 className="text-2xl font-bold text-[#147E74] mb-4">Medicamentos</h1>
          
          <div className="bg-white p-4 rounded-2xl shadow-sm space-y-3 mb-5">
            <div className="flex justify-between items-center border-b pb-2">
              <div>
                <p className="font-bold text-sm text-[#147E74]">💊 Metformina</p>
                <p className="text-xs text-[#5C8C88]">Uso contínuo (850mg)</p>
              </div>
              <span className="bg-emerald-50 text-[#147E74] font-bold text-xs px-2 py-1 rounded">08:00</span>
            </div>
            <div className="flex justify-between items-center">
              <div>
                <p className="font-bold text-sm text-[#147E74]">💊 Losartana</p>
                <p className="text-xs text-[#5C8C88]">Uso contínuo (50mg)</p>
              </div>
              <span className="bg-emerald-50 text-[#147E74] font-bold text-xs px-2 py-1 rounded">20:00</span>
            </div>
          </div>

          <button 
            onClick={() => {
              setLembreteAtivo(!lembreteAtivo);
              alert(lembreteAtivo ? 'Lembretes desativados.' : 'Lembretes ativados com sucesso!');
            }}
            className={`w-full font-bold text-xs py-3 rounded-xl shadow transition ${lembreteAtivo ? 'bg-amber-600 text-white' : 'bg-[#147E74] text-white hover:bg-[#0E6058]'}`}>
            {lembreteAtivo ? 'Desativar lembretes' : 'Ativar lembrete'}
          </button>
        </div>
      );
    }

    // 5. TELA PERFIL
    function PerfilScreen({ setScreen, usuario, setUsuario }) {
      const [nome, setNome] = useState(usuario.nome);
      const [ubs, setUbs] = useState(usuario.ubs);

      const handleSalvar = (e) => {
        e.preventDefault();
        const iniciais = nome.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const novoUsuario = { nome, ubs, iniciais };
        setUsuario(novoUsuario);
        localStorage.setItem('@vida_recife_usuario', JSON.stringify(novoUsuario));
        alert('Perfil atualizado!');
      };

      return (
        <div>
          <button onClick={() => setScreen('home')} className="text-xs font-medium text-[#147E74] flex items-center gap-1 mb-4">
            ← Voltar
          </button>
          
          <h1 className="text-2xl font-bold text-[#147E74] mb-4">Perfil do Paciente</h1>

          <div className="bg-white p-5 rounded-2xl shadow-sm space-y-4">
            <div className="flex justify-center mb-2">
              <div className="w-16 h-16 rounded-full bg-[#147E74] flex items-center justify-center text-white text-xl font-bold shadow">
                {usuario.iniciais}
              </div>
            </div>

            <form onSubmit={handleSalvar} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-[#147E74] mb-1">Nome Completo</label>
                <input 
                  type="text" 
                  value={nome} 
                  onChange={(e) => setNome(e.target.value)}
                  className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-[#147E74]"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-[#147E74] mb-1">Unidade Básica de Saúde (UBS)</label>
                <input 
                  type="text" 
                  value={ubs} 
                  onChange={(e) => setUbs(e.target.value)}
                  className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-[#147E74]"
                />
              </div>

              <button type="submit" className="w-full bg-[#147E74] text-white font-bold text-xs py-3 rounded-xl shadow hover:bg-[#0E6058] transition mt-2">
                Atualizar Perfil
              </button>
            </form>
          </div>
        </div>
      );
    }

    // 6. TELAS AUXILIARES (Consultas / Alimentação)
    function GenericScreen({ title, setScreen, children }) {
      return (
        <div>
          <button onClick={() => setScreen('home')} className="text-xs font-medium text-[#147E74] flex items-center gap-1 mb-4">
            ← Voltar
          </button>
          <h1 className="text-2xl font-bold text-[#147E74] mb-4">{title}</h1>
          <div className="bg-white p-5 rounded-2xl shadow-sm text-xs text-[#5C8C88] leading-relaxed">
            {children}
          </div>
        </div>
      );
    }

    // --- APP PRINCIPAL ---
    function App() {
      const [currentScreen, setCurrentScreen] = useState('home');
      const [historico, setHistorico] = useState([]);
      const [usuario, setUsuario] = useState({
        nome: 'Maria da Silva',
        ubs: 'UBS Boa Vista - Recife',
        iniciais: 'MS'
      });

      useEffect(() => {
        const dadosSalvos = localStorage.getItem('@vida_recife_medicoes');
        if (dadosSalvos) setHistorico(JSON.parse(dadosSalvos));

        const userSalvo = localStorage.getItem('@vida_recife_usuario');
        if (userSalvo) setUsuario(JSON.parse(userSalvo));
      }, []);

      const addMedicao = (dados) => {
        const nova = {
          id: Date.now().toString(),
          data: new Date().toLocaleDateString('pt-BR'),
          hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
          ...dados,
          alerta: dados.glicemia > 180 || dados.sistolica > 140 || dados.diastolica > 90
        };
        const novoHist = [nova, ...historico];
        setHistorico(novoHist);
        localStorage.setItem('@vida_recife_medicoes', JSON.stringify(novoHist));
      };

      return (
        <div className="app-container">
          <main className="content-area">
            {currentScreen === 'home' && <HomeScreen setScreen={setCurrentScreen} historico={historico} usuario={usuario} />}
            {currentScreen === 'registrar' && <RegistrarScreen setScreen={setCurrentScreen} addMedicao={addMedicao} />}
            {currentScreen === 'historico' && <HistoricoScreen setScreen={setCurrentScreen} historico={historico} />}
            {currentScreen === 'remedios' && <RemediosScreen setScreen={setCurrentScreen} />}
            {currentScreen === 'perfil' && <PerfilScreen setScreen={setCurrentScreen} usuario={usuario} setUsuario={setUsuario} />}
            {currentScreen === 'consultas' && (
              <GenericScreen title="Próximas Consultas" setScreen={setCurrentScreen}>
                <p className="font-bold text-[#147E74]">Dr. Roberto Alves (Clínico Geral)</p>
                <p className="mt-1">Data: 15/10/2026 - 09:00</p>
                <p className="mt-1">Local: {usuario.ubs}</p>
              </GenericScreen>
            )}
            {currentScreen === 'alimentacao' && (
              <GenericScreen title="Dicas de Alimentação" setScreen={setCurrentScreen}>
                <p className="font-bold text-[#147E74] mb-2">Química dos Alimentos & Saúde</p>
                <p className="mb-2"><strong>Sódio (NaCl):</strong> O consumo elevado de sal aumenta a osmose no sangue, elevando a pressão arterial.</p>
                <p><strong>Açúcares simples:</strong> São absorvidos rapidamente no trato digestivo, causando picos de glicose na corrente sanguínea.</p>
              </GenericScreen>
            )}
          </main>

          {/* Navegação Inferior Estilo Mobile */}
          <footer className="bg-white border-t border-slate-100 absolute bottom-0 left-0 right-0 h-16 rounded-t-3xl flex items-center justify-around px-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <button onClick={() => setCurrentScreen('home')} className={`flex flex-col items-center gap-0.5 ${currentScreen === 'home' ? 'text-[#C96C55]' : 'text-[#5C8C88]'}`}>
              <IconHome />
              <span className="text-[10px] font-bold">Home</span>
            </button>
            <button onClick={() => setCurrentScreen('historico')} className={`flex flex-col items-center gap-0.5 ${currentScreen === 'historico' ? 'text-[#C96C55]' : 'text-[#5C8C88]'}`}>
              <IconDados />
              <span className="text-[10px] font-bold">Dados</span>
            </button>
            <button onClick={() => setCurrentScreen('remedios')} className={`flex flex-col items-center gap-0.5 ${currentScreen === 'remedios' ? 'text-[#C96C55]' : 'text-[#5C8C88]'}`}>
              <IconMedicamentos />
              <span className="text-[10px] font-bold">Remédios</span>
            </button>
            <button onClick={() => setCurrentScreen('perfil')} className={`flex flex-col items-center gap-0.5 ${currentScreen === 'perfil' ? 'text-[#C96C55]' : 'text-[#5C8C88]'}`}>
              <IconPerfil />
              <span className="text-[10px] font-bold">Perfil</span>
            </button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
